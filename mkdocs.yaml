  #     - Docker Compose: Multi-Container Apps Without the Copy-Paste: efficiency/docker_compose.md
  #     - Docker Volumes and Bind Mounts: efficiency/docker_volumes.md
  #     - Podman Pods: Grouping Containers the Kubernetes Way: efficiency/podman_pods.md
  #     - Quadlets: Running Podman Containers as systemd Services: efficiency/quadlets.md
  #     - The CRI: How Kubernetes Talks to containerd: efficiency/cri_explained.md
  #     - runc and the OCI Runtime: The Layer Nobody Sees: efficiency/runc_oci_runtime.md
  #     - Tagging and Versioning: Avoiding the ':latest' Trap: efficiency/tagging_versioning.md
  #     - Self-Hosting a Registry: Harbor and Distribution: efficiency/self_hosted_registry.md
  #     - Dropping Capabilities and Seccomp Profiles: efficiency/capabilities_seccomp.md
